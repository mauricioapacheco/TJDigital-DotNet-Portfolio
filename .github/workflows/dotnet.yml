name: Validar .NET 10

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependências
        run: dotnet restore tests/TJDigital.Tests/TJDigital.Tests.csproj
      - name: Compilar
        run: dotnet build tests/TJDigital.Tests/TJDigital.Tests.csproj --configuration Release --no-restore
      - name: Executar testes
        run: dotnet test tests/TJDigital.Tests/TJDigital.Tests.csproj --configuration Release --no-build --verbosity normal
